<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Newtech Systems – Contact</title>
<link rel="icon" type="image/png" href="image/WEBSITE FAVICON.png">
<style>
:root{--bg:#eeeeec;--ink:#2f2e30;--card:#fff;--line:#d9d9d6;--mute:#6b6a6d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:460px;margin:0 auto;padding:36px 18px 40px}
header{text-align:center;margin-bottom:26px}
header img{width:150px;height:auto;display:block;margin:0 auto 10px}
header p{margin:0;color:var(--mute);font-size:15px}
.list{display:flex;flex-direction:column;gap:10px}
.btn{display:flex;align-items:center;gap:14px;width:100%;padding:15px 16px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);font:600 16px/1.2 inherit;text-decoration:none;text-align:left;cursor:pointer;transition:background .15s,color .15s,transform .1s}
.btn:hover{background:var(--ink);color:#fff}
.btn:active{transform:scale(.98)}
.btn:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.btn svg{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn .chev{margin-left:auto;width:18px;height:18px;transition:transform .2s}
.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.primary:hover{background:#000}
details{border:1px solid var(--line);border-radius:14px;background:var(--card);overflow:hidden}
details summary{list-style:none;border:0;border-radius:0;background:transparent}
details summary::-webkit-details-marker{display:none}
details summary:hover{background:var(--ink);color:#fff}
details[open] .chev{transform:rotate(180deg)}
.nums a{display:block;padding:14px 16px 14px 52px;border-top:1px solid var(--line);color:var(--ink);text-decoration:none;font-weight:500;letter-spacing:.02em}
.nums a:hover{background:#f4f4f2}
.nums a:focus-visible{outline:3px solid var(--ink);outline-offset:-3px}
#lb{position:fixed;inset:0;background:rgba(20,20,20,.88);display:none;align-items:center;justify-content:center;padding:18px;z-index:9;flex-direction:column;gap:14px}
#lb.on{display:flex}
#lb img{max-width:100%;max-height:80vh;border-radius:8px;background:#fff}
#lb button{background:#fff;color:var(--ink);border:0;border-radius:999px;padding:11px 26px;font:600 15px inherit;cursor:pointer}
footer{text-align:center;color:var(--mute);font-size:13px;margin-top:26px}
</style></head><body>
